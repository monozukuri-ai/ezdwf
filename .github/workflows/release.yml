name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: ezdwf
  PYTHON_VERSION: "3.13"

jobs:
  preflight:
    name: Test and validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate package and tag versions
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          workspace = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))

          python_version = project["project"]["version"]
          rust_version = workspace["workspace"]["package"]["version"]
          if python_version != rust_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={python_version}, "
                  f"Cargo.toml={rust_version}"
              )

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected_tag = f"v{python_version}"
              actual_tag = os.environ["GITHUB_REF_NAME"]
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Tag/version mismatch: expected {expected_tag}, got {actual_tag}"
                  )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={python_version}", file=output)
          PY

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Install package and test dependencies
        run: python -m pip install "pytest>=8" ".[plot]"

      - name: Test Python package
        run: pytest -q

      - name: Verify command-line entry point
        run: python -m ezdwf --version

  build-wheels:
    name: Build wheel (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macos-universal2
            os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build-sdist:
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release artifacts
    needs:
      - preflight
      - build-wheels
      - build-sdist
    runs-on: ubuntu-latest

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          package = os.environ["PACKAGE_NAME"]
          version = os.environ["VERSION"]
          dist = Path("dist")
          wheels = sorted(dist.glob(f"{package}-{version}-*.whl"))
          sdists = sorted(dist.glob(f"{package}-{version}.tar.gz"))

          if len(wheels) != 4:
              raise SystemExit(f"Expected 4 wheels, found {len(wheels)}: {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected 1 sdist, found {len(sdists)}: {sdists}")

          required = {
              "ezdwf/__init__.py",
              "ezdwf/_core.pyi",
              "ezdwf/document.py",
              "ezdwf/matplotlib.py",
              "ezdwf/py.typed",
              "ezdwf/raw.py",
              "ezdwf/svg.py",
          }
          for wheel in wheels:
              if "-cp310-abi3-" not in wheel.name:
                  raise SystemExit(f"Wheel does not use the cp310 ABI3 tag: {wheel.name}")
              expected_extension = (
                  "ezdwf/_core.pyd"
                  if "-win_" in wheel.name
                  else "ezdwf/_core.abi3.so"
              )
              with ZipFile(wheel) as archive:
                  names = set(archive.namelist())
                  missing = required - names
                  if missing:
                      raise SystemExit(f"{wheel.name} is missing {sorted(missing)}")
                  if expected_extension not in names:
                      raise SystemExit(
                          f"{wheel.name} is missing ABI3 extension {expected_extension}"
                      )
                  if any(name.lower().endswith((".dwf", ".dwfx")) for name in names):
                      raise SystemExit(f"{wheel.name} unexpectedly contains sample drawings")

                  metadata_name = next(
                      name for name in names if name.endswith(".dist-info/METADATA")
                  )
                  metadata = BytesParser().parsebytes(archive.read(metadata_name))
                  if metadata["Version"] != version:
                      raise SystemExit(f"Wrong version in {wheel.name}")
                  if metadata["Requires-Python"] != ">=3.10":
                      raise SystemExit(f"Wrong Python requirement in {wheel.name}")
                  if metadata["License-Expression"] != "MIT":
                      raise SystemExit(f"Wrong license expression in {wheel.name}")
                  if "LICENSE" not in metadata.get_all("License-File", []):
                      raise SystemExit(f"{wheel.name} does not declare LICENSE")

          for artifact in (*wheels, *sdists):
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              print(f"{digest}  {artifact.name}")
          PY

      - name: Upload complete release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-wheel:
    name: Verify installed wheel (Python ${{ matrix.python }})
    needs:
      - preflight
      - assemble
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.14"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Install wheel without source checkout
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python -m pip install --no-index --no-deps --find-links dist
          "${PACKAGE_NAME}==${VERSION}"

      - name: Verify installed API and native parser
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import ezdwf

          version = os.environ["VERSION"]
          assert importlib.metadata.version("ezdwf") == version
          assert ezdwf.__version__ == version

          for name in (
              "Drawing",
              "Entity",
              "ParseLimits",
              "Sheet",
              "detect_format",
              "inspect_dwfx",
              "inspect_package",
              "read",
              "plot",
              "render_svg",
              "save_plot",
          ):
              assert hasattr(ezdwf, name), name

          detected = ezdwf.detect_format(b"(DWF V00.55)payload")
          assert detected.kind == "legacy_dwf"
          assert detected.version == "00.55"

          package_dir = Path(ezdwf.__file__).parent
          for relative_path in (
              "_core.pyi",
              "document.py",
              "matplotlib.py",
              "py.typed",
              "raw.py",
              "svg.py",
          ):
              assert (package_dir / relative_path).is_file(), relative_path
          PY

      - name: Verify command-line entry point
        run: ezdwf --version

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - preflight
      - assemble
      - verify-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ezdwf
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - preflight
      - assemble
      - verify-wheel
      - pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
